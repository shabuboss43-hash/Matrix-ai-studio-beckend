<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matrix AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0c10;
    --bg-elevated: #131519;
    --surface: #191b21;
    --surface-hover: #20232b;
    --border: #2a2d36;
    --text: #ece9e2;
    --text-muted: #96938c;
    --text-dim: #5c5a56;
    --accent-a: #d99a4e;
    --accent-b: #6f9bb5;
    --accent-c: #4f9d94;
    --accent-grad: linear-gradient(135deg, #e3ab66, #c9853a);
    --signal: #7fb88a;
    --danger: #e07a6b;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.035) 1px, transparent 0) 0 0/26px 26px,
      radial-gradient(ellipse 120% 80% at 50% -10%, #17191f 0%, var(--bg) 55%);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
    overflow:hidden;
  }

  /* ---------- sidebar ---------- */
  .sidebar-backdrop{
    position:fixed; inset:0;
    background:rgba(5,5,8,0.6);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:40;
  }
  .sidebar-backdrop.open{opacity:1; pointer-events:auto;}

  .sidebar{
    position:fixed; top:0; left:0; bottom:0;
    width:min(300px, 86vw);
    background:#0d0e14;
    border-right:1px solid var(--border);
    transform:translateX(-100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    z-index:50;
    display:flex;
    flex-direction:column;
    padding:16px 14px 18px;
    gap:18px;
    overflow-y:auto;
  }
  .sidebar.open{transform:translateX(0);}

  .sidebar-header{display:flex; align-items:center; justify-content:space-between;}
  .sidebar-brand{display:flex; align-items:center; gap:10px; font-family:'Inter',sans-serif; font-weight:600; font-size:15px; letter-spacing:-0.01em;}
  .brand-mark.small{width:26px; height:26px; font-size:12px; border-radius:7px;}

  .new-chat-btn{
    width:100%;
    display:flex; align-items:center; gap:9px;
    padding:10px 14px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .new-chat-btn:hover{border-color:var(--accent-a); background:var(--surface-hover);}

  .sidebar-section{display:flex; flex-direction:column; gap:6px;}
  .sidebar-section-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 2px;
  }
  .sidebar-section-head span{
    font-size:12px;
    color:var(--text-muted);
    font-family:'Inter',sans-serif;
    font-weight:500;
  }
  .pill-btn{
    font-size:11px;
    color:var(--text-muted);
    background:transparent;
    border:1px solid var(--border);
    padding:3px 10px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .pill-btn:hover{border-color:var(--accent-a); color:var(--text);}

  .persona-list, .conversation-list{display:flex; flex-direction:column; gap:2px;}
  .empty-hint{
    font-size:12px;
    color:var(--text-dim);
    padding:10px 6px;
    line-height:1.5;
  }

  .persona-row, .conversation-row, .feature-row{
    display:flex; align-items:center; gap:10px;
    padding:8px 8px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
    background:none;
    width:100%;
    text-align:left;
    font-family:'Inter',sans-serif;
    transition:background .15s ease, border-color .15s ease;
  }
  .persona-row:hover, .conversation-row:hover, .feature-row:hover{background:var(--surface-hover);}
  .persona-row.active, .conversation-row.active, .feature-row.active{background:var(--surface-hover); border-color:var(--accent-a);}

  .row-dot.code-dot{color:var(--accent-b); border-color:rgba(111,155,181,0.35);}
  .row-dot.fathom-dot{color:var(--accent-c); border-color:rgba(79,157,148,0.35);}
  .badge{
    font-size:9.5px;
    padding:2px 7px;
    border-radius:8px;
    background:rgba(217,154,78,0.15);
    color:var(--accent-a);
    border:1px solid rgba(217,154,78,0.35);
    letter-spacing:.02em;
    flex-shrink:0;
    font-family:'JetBrains Mono',monospace;
  }
  .badge.badge-muted{
    background:var(--surface);
    color:var(--text-dim);
    border-color:var(--border);
  }
  .feature-row.disabled{cursor:default;}
  .feature-row.disabled:hover{background:none;}
  .feature-row.disabled .row-dot, .feature-row.disabled .row-title{opacity:.5;}
  .feature-row.disabled .row-sub{opacity:.35;}

  .persona-avatar{width:26px; height:26px; font-size:11px; flex-shrink:0;}
  .row-dot{
    width:26px; height:26px; flex-shrink:0;
    border-radius:8px;
    background:var(--surface);
    border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim);
  }

  .row-text{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px;}
  .row-title{
    font-size:13px; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .row-sub{
    font-size:11px; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .row-actions{display:flex; gap:2px; opacity:0; transition:opacity .15s ease; flex-shrink:0;}
  .persona-row:hover .row-actions, .conversation-row:hover .row-actions{opacity:1;}
  .row-action-btn{
    width:22px; height:22px;
    border-radius:6px; border:none;
    background:transparent; color:var(--text-dim);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .row-action-btn:hover{background:var(--bg-elevated); color:var(--text);}
  .row-action-btn.delete-btn:hover{color:var(--danger);}

  /* ---------- code preview panel ---------- */
  .preview-backdrop{
    position:fixed; inset:0;
    background:rgba(5,5,8,0.6);
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
    z-index:60;
  }
  .preview-backdrop.open{opacity:1; pointer-events:auto;}
  .preview-panel{
    position:fixed; top:0; right:0; bottom:0;
    width:min(560px, 92vw);
    background:#0d0e14;
    border-left:1px solid var(--border);
    transform:translateX(100%);
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    z-index:70;
    display:flex; flex-direction:column;
  }
  .preview-panel.open{transform:translateX(0);}
  .preview-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .preview-header h3{
    font-family:'Inter',sans-serif;
    font-size:14.5px; font-weight:600;
    display:flex; align-items:center; gap:8px;
    color:var(--text);
  }
  .preview-header-actions{display:flex; gap:6px;}
  .preview-body{flex:1; background:#fff;}
  .preview-body iframe{width:100%; height:100%; border:none; display:block;}

  /* ---------- create/edit AI modal ---------- */
  .modal-backdrop{
    position:fixed; inset:0;
    background:rgba(5,5,8,0.65);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
    z-index:100;
  }
  .modal-backdrop.open{opacity:1; pointer-events:auto;}
  .modal{
    width:100%; max-width:440px;
    margin:16px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:16px;
    padding:22px;
    box-shadow:0 24px 70px rgba(0,0,0,0.5);
    transform:translateY(10px);
    transition:transform .2s ease;
  }
  .modal-backdrop.open .modal{transform:translateY(0);}
  .modal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .modal-header h2{font-family:'Fraunces',serif; font-size:19px; font-weight:600; letter-spacing:-0.01em;}
  .field-label{
    display:block; font-size:12.5px; color:var(--text-muted);
    margin:16px 0 6px; font-family:'Inter',sans-serif;
  }
  .text-input, .text-area-input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14px;
    outline:none;
    transition:border-color .15s ease;
  }
  .text-input:focus, .text-area-input:focus{border-color:var(--accent-a);}
  .text-area-input{resize:vertical; min-height:110px; line-height:1.5;}
  .modal-footer{display:flex; justify-content:flex-end; gap:10px; margin-top:20px;}
  .btn-ghost{
    padding:9px 16px; border-radius:10px;
    border:1px solid var(--border); background:transparent;
    color:var(--text-muted); cursor:pointer; font-size:13.5px;
    transition:border-color .15s ease, color .15s ease;
  }
  .btn-ghost:hover{border-color:var(--text-dim); color:var(--text);}
  .btn-primary{
    padding:9px 18px; border-radius:10px; border:none;
    background:var(--accent-grad); color:#0a0b0f; font-weight:600;
    cursor:pointer; font-size:13.5px; transition:opacity .15s ease;
  }
  .btn-primary:disabled{opacity:.4; cursor:not-allowed;}
  .btn-primary:hover:not(:disabled){opacity:.92;}

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    border-bottom:1px solid var(--border);
    background:rgba(10,11,15,0.72);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    z-index:10;
    flex-shrink:0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:34px;height:34px;
    border-radius:9px;
    background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:15px;
    color:#0a0b0f;
    flex-shrink:0;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:16.5px;
    letter-spacing:-0.01em;
  }
  .brand-status{
    font-size:11.5px;
    color:var(--text-muted);
    display:flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono', monospace;
  }
  .status-dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--signal);
    box-shadow:0 0 8px var(--signal);
  }
  .header-actions{display:flex;gap:8px;}
  .icon-btn{
    width:34px;height:34px;
    border-radius:8px;
    background:transparent;
    border:1px solid transparent;
    color:var(--text-muted);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border);}

  /* ---------- chat area ---------- */
  main{
    flex:1;
    overflow-y:auto;
    scroll-behavior:smooth;
  }
  .chat-inner{
    max-width:760px;
    margin:0 auto;
    padding:32px 24px 140px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 24px;
    gap:14px;
  }
  .empty-mark{
    width:56px;height:56px;
    border-radius:14px;
    background:var(--accent-grad);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:24px;
    color:#0a0b0f;
    margin-bottom:6px;
  }
  .empty-state h1{
    font-family:'Fraunces',serif;
    font-size:27px;
    font-weight:600;
    letter-spacing:-0.01em;
  }
  .empty-state p{
    color:var(--text-muted);
    font-size:14.5px;
    max-width:380px;
    line-height:1.5;
  }
  .suggestions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:14px;
    max-width:480px;
  }
  .chip{
    font-size:13px;
    color:var(--text-muted);
    background:var(--surface);
    border:1px solid var(--border);
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition:border-color .15s ease, color .15s ease;
  }
  .chip:hover{border-color:var(--accent-a);color:var(--text);}

  .msg-row{display:flex;gap:14px;align-items:flex-start;animation:rise .32s cubic-bezier(.2,.7,.3,1) both;}
  .msg-row.user{flex-direction:row-reverse;}
  @keyframes rise{
    from{opacity:0;transform:translateY(8px);}
    to{opacity:1;transform:translateY(0);}
  }
  @media (prefers-reduced-motion: reduce){
    .msg-row{animation:none;}
  }
  .avatar{
    width:30px;height:30px;
    border-radius:8px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    font-family:'Inter',sans-serif;
    font-weight:600;
  }
  .avatar.ai{background:var(--accent-grad);color:#0a0b0f;}
  .avatar.user{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);}

  .bubble-col{display:flex;flex-direction:column;gap:6px;max-width:78%;}
  .msg-row.user .bubble-col{align-items:flex-end;}
  .meta-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 2px;
  }
  .msg-row.user .meta-row{flex-direction:row-reverse;}
  .sender{
    font-size:11.5px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
  }
  .timestamp{
    font-size:10.5px;
    color:var(--text-dim);
    font-family:'JetBrains Mono',monospace;
    opacity:.6;
  }
  .copy-btn{
    opacity:0;
    width:22px;height:22px;
    border-radius:6px;
    border:none;
    background:transparent;
    color:var(--text-dim);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:opacity .15s ease, background .15s ease, color .15s ease;
  }
  .msg-row.ai:hover .copy-btn{opacity:1;}
  .copy-btn:hover{background:var(--surface-hover);color:var(--text);}
  .copy-btn.copied{opacity:1;color:var(--accent-a);}
  .preview-btn:hover{color:var(--accent-b);}
  .bubble{
    padding:12px 16px;
    border-radius:14px;
    font-size:14.5px;
    line-height:1.6;
    white-space:pre-wrap;
    word-wrap:break-word;
  }
  .msg-row.ai .bubble{
    background:var(--surface);
    border:1px solid var(--border);
    border-top-left-radius:4px;
  }
  .msg-row.user .bubble{
    background:var(--accent-grad);
    color:#0a0b0f;
    font-weight:500;
    border-top-right-radius:4px;
  }
  .bubble code{
    font-family:'JetBrains Mono',monospace;
    background:rgba(255,255,255,0.06);
    padding:2px 5px;
    border-radius:4px;
    font-size:13px;
  }
  .msg-row.user .bubble code{background:rgba(0,0,0,0.12);}
  .bubble pre{
    background:#0d0e13;
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    overflow-x:auto;
    margin:6px 0;
  }
  .bubble pre code{background:none;padding:0;}

  .cursor{
    display:inline-block;
    width:2px;height:14px;
    background:var(--accent-b);
    margin-left:2px;
    vertical-align:middle;
    animation:blink 0.9s infinite;
  }
  @keyframes blink{0%,49%{opacity:1;}50%,100%{opacity:0;}}

  .typing{
    display:flex;gap:4px;align-items:center;
    padding:14px 16px;
  }
  .typing span{
    width:6px;height:6px;border-radius:50%;
    background:var(--text-muted);
    animation:bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2){animation-delay:.15s;}
  .typing span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.4;}
    30%{transform:translateY(-4px);opacity:1;}
  }

  /* ---------- input ---------- */
  .input-zone{
    position:sticky;
    bottom:0;
    padding:18px 24px 24px;
    background:linear-gradient(to top, var(--bg) 55%, transparent);
    flex-shrink:0;
  }
  .input-inner{max-width:760px;margin:0 auto;}
  .input-shell{
    display:flex;
    align-items:flex-end;
    gap:8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:18px;
    padding:6px 8px;
    box-shadow:0 8px 30px rgba(0,0,0,0.35);
    transition:border-color .15s ease;
  }
  .input-shell:focus-within{border-color:var(--accent-a);}
  textarea{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    color:var(--text);
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    line-height:1.5;
    max-height:160px;
    padding:8px 0;
  }
  textarea::placeholder{color:var(--text-dim);}
  .send-btn{
    width:38px;height:38px;
    border-radius:12px;
    border:none;
    background:var(--accent-grad);
    color:#0a0b0f;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    transition:opacity .15s ease, transform .1s ease;
  }
  .send-btn:disabled{opacity:.35;cursor:not-allowed;}
  .send-btn:not(:disabled):active{transform:scale(0.92);}
  #attachBtn{flex-shrink:0;}

  /* ---------- attachments ---------- */
  .attachment-preview{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:10px;
  }
  .attachment-chip{
    display:flex; align-items:center; gap:8px;
    background:var(--bg-elevated);
    border:1px solid var(--border);
    border-radius:10px;
    padding:6px 8px 6px 6px;
    max-width:220px;
  }
  .attachment-thumb{
    width:34px; height:34px; border-radius:6px;
    object-fit:cover; flex-shrink:0;
  }
  .attachment-file-icon{
    width:34px; height:34px; border-radius:6px;
    background:var(--surface);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); flex-shrink:0;
  }
  .attachment-info{min-width:0; flex:1; display:flex; flex-direction:column; gap:1px;}
  .attachment-name{
    font-size:12px; color:var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .attachment-size{font-size:10.5px; color:var(--text-dim); font-family:'JetBrains Mono',monospace;}
  .attachment-remove{
    width:18px; height:18px; border-radius:5px; border:none;
    background:transparent; color:var(--text-dim); cursor:pointer;
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:15px; line-height:1;
  }
  .attachment-remove:hover{background:var(--surface-hover); color:var(--danger);}

  .bubble-attachments{
    display:flex; flex-wrap:wrap; gap:6px;
    margin-bottom:8px;
  }
  .bubble-attachment-img{
    width:120px; height:120px; object-fit:cover;
    border-radius:10px; border:1px solid var(--border);
  }
  .bubble-attachment-file{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12px; font-family:'JetBrains Mono',monospace;
    background:rgba(255,255,255,0.06);
    padding:6px 10px; border-radius:8px;
  }
  .msg-row.user .bubble-attachment-file{background:rgba(0,0,0,0.15);}

  .toast{
    position:fixed; left:50%; bottom:28px;
    transform:translate(-50%, 8px);
    background:var(--bg-elevated);
    border:1px solid var(--border);
    color:var(--text);
    font-size:13px;
    padding:10px 16px;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    z-index:200;
    max-width:80vw;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}

  .footnote{
    text-align:center;
    font-size:11px;
    color:var(--text-dim);
    margin-top:10px;
    font-family:'JetBrains Mono',monospace;
  }

  main::-webkit-scrollbar{width:8px;}
  main::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  main::-webkit-scrollbar-track{background:transparent;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <button class="icon-btn" id="menuBtn" title="Menu">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="brand-mark" id="brandMark">M</div>
    <div class="brand-text">
      <div class="brand-name" id="brandName">Matrix AI</div>
      <div class="brand-status"><span class="status-dot"></span><span id="brandStatusText">online</span></div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="clearBtn" title="New chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</header>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <div class="brand-mark small">M</div>
      <span>Matrix AI</span>
    </div>
    <button class="icon-btn" id="sidebarCloseBtn" title="Close">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <button class="new-chat-btn" id="newChatBtn">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    New chat
  </button>

  <div class="sidebar-section">
    <button class="feature-row" id="matrixCodeBtn">
      <div class="row-dot code-dot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
      </div>
      <div class="row-text">
        <div class="row-title">Matrix Code</div>
        <div class="row-sub">Coding-focused · Codestral</div>
      </div>
      <span class="badge">New</span>
    </button>
    <button class="feature-row" id="fathomBtn">
      <div class="row-dot fathom-dot">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6c1.5 2 3.5 2 5 0s3.5-2 5 0 3.5 2 5 0 3.5-2 5 0"/><path d="M2 12c1.5 2 3.5 2 5 0s3.5-2 5 0 3.5 2 5 0 3.5-2 5 0"/><path d="M2 18c1.5 2 3.5 2 5 0s3.5-2 5 0 3.5 2 5 0 3.5-2 5 0"/></svg>
      </div>
      <div class="row-text">
        <div class="row-title">Fathom</div>
        <div class="row-sub">Ultra AI · Kimi K3</div>
      </div>
    </button>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-head">
      <span>My Matrix</span>
      <button class="pill-btn" id="createPersonaBtn">+ Create</button>
    </div>
    <div class="persona-list" id="personaList"></div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-head"><span>Chats</span></div>
    <div class="conversation-list" id="conversationList"></div>
  </div>
</aside>

<div class="modal-backdrop" id="personaModalBackdrop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="personaModalTitle">Create your AI</h2>
      <button class="icon-btn" id="personaModalClose" title="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <label class="field-label" for="personaNameInput">Name</label>
    <input type="text" id="personaNameInput" class="text-input" placeholder="e.g. Study Buddy, Code Reviewer, Sales Coach" maxlength="40">

    <label class="field-label" for="personaInstructionsInput">Instructions</label>
    <textarea id="personaInstructionsInput" class="text-area-input" rows="6" placeholder="Describe how this AI should behave: its tone, expertise, and anything it should always do or avoid."></textarea>

    <div class="modal-footer">
      <button class="btn-ghost" id="personaModalCancel">Cancel</button>
      <button class="btn-primary" id="personaModalSave" disabled>Save AI</button>
    </div>

</div>

<div class="preview-backdrop" id="previewBackdrop"></div>
<aside class="preview-panel" id="previewPanel">
  <div class="preview-header">
    <h3>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
      Preview
    </h3>
    <div class="preview-header-actions">
      <button class="icon-btn" id="previewOpenTabBtn" title="Open in new tab">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
      </button>
      <button class="icon-btn" id="previewCloseBtn" title="Close">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </div>
  <div class="preview-body">
    <iframe id="previewFrame" sandbox="allow-scripts allow-modals allow-forms allow-popups"></iframe>
  </div>
</aside>

<main id="main">
  <div class="chat-inner" id="chatInner">
    <div class="empty-state" id="emptyState">
      <div class="empty-mark">M</div>
      <h1>Matrix AI</h1>
      <p>Ask anything. Explanations, code, brainstorming, or just a conversation.</p>
      <div class="suggestions">
        <div class="chip" data-q="Explain quantum computing in simple terms">Explain quantum computing</div>
        <div class="chip" data-q="Give me a 3-day itinerary for Tokyo">Plan a Tokyo trip</div>
        <div class="chip" data-q="Write a short poem about the ocean">Write a poem</div>
        <div class="chip" data-q="What is your name?">Who are you?</div>
      </div>
    </div>
  </div>
</main>

<div class="input-zone">
  <div class="input-inner">
    <div class="attachment-preview" id="attachmentPreview" style="display:none;"></div>
    <div class="input-shell">
      <button class="icon-btn" id="attachBtn" title="Attach file" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input type="file" id="fileInput" multiple hidden accept="image/*,.txt,.md,.markdown,.json,.csv,.js,.jsx,.ts,.tsx,.py,.html,.htm,.css,.xml,.yaml,.yml,.log,.sh,.c,.cpp,.java,.rb,.go,.rs,.sql">
      <textarea id="input" rows="1" placeholder="Message Matrix AI..."></textarea>
      <button class="send-btn" id="sendBtn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
    <div class="footnote">Matrix AI can make mistakes. Verify important information.</div>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // All provider keys and endpoints now live only on the backend
  // (matrix-ai-backend/.env). The browser just calls our own /api/chat
  // and tells it which persona is talking; nothing secret ships here.
  const CHAT_ENDPOINT = "/api/chat";

  // Matrix Code is a built-in, pinned persona (not stored in the user's
  // custom "My Matrix" list) that always talks to a coding-focused model
  // via the xKiro provider on the backend instead of the default one.
  const MATRIX_CODE_ID = '__matrix_code__';
  const MATRIX_CODE_PERSONA = {
    id: MATRIX_CODE_ID,
    name: 'Matrix Code',
    provider: 'xkiro',
    instructions: 'You are Matrix Code, built specifically for coding: writing, reviewing, ' +
      'debugging, and explaining code across languages and frameworks. Be precise and ' +
      'production-minded, and prefer complete, runnable code over fragments. When producing ' +
      'front-end snippets, prefer a single self-contained HTML block (with inline <style> and ' +
      '<script> as needed) so it can be previewed directly.'
  };

  // Fathom is also a built-in, pinned persona, but keeps its own separate
  // identity rather than the "Matrix Code" framing.
  const FATHOM_ID = '__fathom__';
  const FATHOM_PERSONA = {
    id: FATHOM_ID,
    name: 'Fathom',
    provider: 'fathom',
    instructions: 'You are Fathom, an ultra AI model from Matrix AI. Be helpful, thoughtful, ' +
      'and clear, and go deep when a question calls for it.'
  };

  const BASE_SYSTEM_PROMPT = `You are Matrix AI, a helpful, thoughtful AI assistant. ` +
    `If asked who you are, what your name is, what model you are, who made you, or ` +
    `anything about your identity/origin, you must answer that your name is "Matrix AI" ` +
    `and nothing else about underlying models or providers. Otherwise, answer the user's ` +
    `question normally, clearly, and helpfully.`;

  // Builds the system prompt for the currently active custom AI (if any).
  // A persona layers its own name + creator instructions on top of the
  // base assistant, while still never revealing the underlying model.
  function buildSystemPrompt(persona){
    if(!persona) return BASE_SYSTEM_PROMPT;
    if(persona.id === MATRIX_CODE_ID){
      return `You are Matrix Code, an AI built specifically for coding. ${persona.instructions} ` +
        `If asked who you are or what your name is, answer exactly: "I am Matrix Code, specifically ` +
        `made for coding." Never reveal any other underlying model or provider name.`;
    }
    if(persona.id === FATHOM_ID){
      return `${persona.instructions} If asked who you are or what your name is, answer exactly: ` +
        `"I'm Fathom, an ultra AI model from Matrix AI." Never reveal any other underlying model or ` +
        `provider name.`;
    }
    return `You are ${persona.name}, a custom AI built on Matrix AI. Follow these ` +
      `instructions from your creator at all times, staying in character for the whole ` +
      `conversation:\n"""\n${persona.instructions}\n"""\n` +
      `If asked who you are or what your name is, answer that your name is "${persona.name}". ` +
      `If asked what you're built on or powered by, you may say Matrix AI, but never reveal ` +
      `any other underlying model or provider name.`;
  }

  function identityReplyFor(persona){
    if(persona && persona.id === MATRIX_CODE_ID) return "I am Matrix Code, specifically made for coding.";
    if(persona && persona.id === FATHOM_ID) return "I'm Fathom, an ultra AI model from Matrix AI.";
    return persona
      ? `I'm ${persona.name}, built on Matrix AI. How can I help you today?`
      : "I'm Matrix AI. How can I help you today?";
  }

  const IDENTITY_PATTERNS = [
    /\bwhat('?s| is)\s+your\s+name\b/i,
    /\bwho\s+are\s+you\b/i,
    /\bwhat\s+are\s+you\b/i,
    /\bhow\s+are\s+you\b/i,
    /\bwhich\s+(model|ai)\s+are\s+you\b/i,
    /\bwhat\s+model\s+(is\s+this|are\s+you)\b/i,
    /\bare\s+you\s+(chatgpt|gpt|gemini|claude|qwen|llama|nex)\b/i,
    /\bwho\s+(made|created|built|trained)\s+you\b/i,
    /\byour\s+(name|identity)\b/i,
  ];


  let history = []; // {role, content} for the currently open chat
  const main = document.getElementById('main');
  const chatInner = document.getElementById('chatInner');
  const emptyState = document.getElementById('emptyState');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const clearBtn = document.getElementById('clearBtn');

  // ---------- sidebar / persona / history state ----------
  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const menuBtn = document.getElementById('menuBtn');
  const sidebarCloseBtn = document.getElementById('sidebarCloseBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const matrixCodeBtn = document.getElementById('matrixCodeBtn');
  const fathomBtn = document.getElementById('fathomBtn');
  const createPersonaBtn = document.getElementById('createPersonaBtn');
  const personaListEl = document.getElementById('personaList');
  const conversationListEl = document.getElementById('conversationList');
  const brandMarkEl = document.getElementById('brandMark');
  const brandNameEl = document.getElementById('brandName');
  const brandStatusTextEl = document.getElementById('brandStatusText');

  const personaModalBackdrop = document.getElementById('personaModalBackdrop');
  const personaModalTitle = document.getElementById('personaModalTitle');
  const personaModalClose = document.getElementById('personaModalClose');
  const personaModalCancel = document.getElementById('personaModalCancel');
  const personaModalSave = document.getElementById('personaModalSave');
  const personaNameInput = document.getElementById('personaNameInput');
  const personaInstructionsInput = document.getElementById('personaInstructionsInput');

  const PERSONA_KEY = 'matrixai:personas';
  const CONVO_KEY = 'matrixai:conversations';

  function uid(){
    return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));
  }
  function singleLine(str){
    return (str || '').replace(/\s+/g, ' ').trim();
  }
  function loadJSON(key){
    try{
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : [];
    } catch(e){ return []; }
  }
  function relTime(ts){
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if(min < 1) return 'Just now';
    if(min < 60) return min + 'm ago';
    const hr = Math.floor(min / 60);
    if(hr < 24) return hr + 'h ago';
    const day = Math.floor(hr / 24);
    if(day < 7) return day + 'd ago';
    return new Date(ts).toLocaleDateString([], { month: 'short', day: 'numeric' });
  }

  let personas = loadJSON(PERSONA_KEY);
  let conversations = loadJSON(CONVO_KEY);
  let activePersonaId = null;
  let activeConversationId = null;

  function savePersonas(){ localStorage.setItem(PERSONA_KEY, JSON.stringify(personas)); }
  function saveConversations(){ localStorage.setItem(CONVO_KEY, JSON.stringify(conversations)); }
  function getActivePersona(){
    if(activePersonaId === MATRIX_CODE_ID) return MATRIX_CODE_PERSONA;
    if(activePersonaId === FATHOM_ID) return FATHOM_PERSONA;
    return personas.find(p => p.id === activePersonaId) || null;
  }

  function openSidebar(){ sidebar.classList.add('open'); sidebarBackdrop.classList.add('open'); }
  function closeSidebar(){ sidebar.classList.remove('open'); sidebarBackdrop.classList.remove('open'); }
  menuBtn.addEventListener('click', openSidebar);
  sidebarCloseBtn.addEventListener('click', closeSidebar);
  sidebarBackdrop.addEventListener('click', closeSidebar);

  function updateHeader(){
    const persona = getActivePersona();
    brandMarkEl.textContent = persona ? persona.name.slice(0, 1).toUpperCase() : 'M';
    brandNameEl.textContent = persona ? persona.name : 'Matrix AI';
    brandStatusTextEl.textContent = persona
      ? (persona.id === MATRIX_CODE_ID ? 'Coding AI · online' : persona.id === FATHOM_ID ? 'Ultra AI · online' : 'Custom AI · online')
      : 'online';
    input.placeholder = 'Message ' + (persona ? persona.name : 'Matrix AI') + '...';
  }

  const DEFAULT_SUGGESTIONS = [
    { q: 'Explain quantum computing in simple terms', label: 'Explain quantum computing' },
    { q: 'Give me a 3-day itinerary for Tokyo', label: 'Plan a Tokyo trip' },
    { q: 'Write a short poem about the ocean', label: 'Write a poem' },
    { q: 'What is your name?', label: 'Who are you?' }
  ];
  const CODE_SUGGESTIONS = [
    { q: 'Build a responsive pricing page in a single HTML file', label: 'Build a pricing page' },
    { q: 'Write a debounce function in JavaScript and explain it', label: 'Write a debounce fn' },
    { q: 'Review this function for bugs and suggest fixes', label: 'Review my code' },
    { q: 'What is your name?', label: 'Who are you?' }
  ];

  function renderSuggestions(list){
    const suggestionsEl = document.querySelector('.suggestions');
    suggestionsEl.innerHTML = '';
    list.forEach(item => {
      const chip = document.createElement('div');
      chip.className = 'chip';
      chip.textContent = item.label;
      chip.addEventListener('click', () => {
        input.value = item.q;
        updateSendState();
        sendMessage();
      });
      suggestionsEl.appendChild(chip);
    });
  }

  function updateEmptyStateForActive(){
    const persona = getActivePersona();
    const markEl = document.querySelector('.empty-mark');
    const h1El = document.querySelector('.empty-state h1');
    const pEl = document.querySelector('.empty-state p');
    const suggestionsEl = document.querySelector('.suggestions');
    if(persona && persona.id === MATRIX_CODE_ID){
      markEl.textContent = 'M';
      h1El.textContent = 'Matrix Code';
      pEl.textContent = 'Ask for code, a fix, or a feature build — front-end snippets can be previewed live.';
      suggestionsEl.style.display = 'flex';
      renderSuggestions(CODE_SUGGESTIONS);
    } else if(persona && persona.id === FATHOM_ID){
      markEl.textContent = 'F';
      h1El.textContent = 'Fathom';
      pEl.textContent = 'An ultra AI model from Matrix AI. Ask anything — Fathom is built for depth.';
      suggestionsEl.style.display = 'flex';
      renderSuggestions(DEFAULT_SUGGESTIONS);
    } else if(persona){
      markEl.textContent = persona.name.slice(0, 1).toUpperCase();
      h1El.textContent = persona.name;
      const desc = singleLine(persona.instructions);
      pEl.textContent = desc.length > 140 ? desc.slice(0, 140) + '…' : desc;
      suggestionsEl.style.display = 'none';
    } else {
      markEl.textContent = 'M';
      h1El.textContent = 'Matrix AI';
      pEl.textContent = 'Ask anything. Explanations, code, brainstorming, or just a conversation.';
      suggestionsEl.style.display = 'flex';
      renderSuggestions(DEFAULT_SUGGESTIONS);
    }
  }

  function renderPersonaList(){
    matrixCodeBtn.classList.toggle('active', activePersonaId === MATRIX_CODE_ID);
    fathomBtn.classList.toggle('active', activePersonaId === FATHOM_ID);
    personaListEl.innerHTML = '';
    if(personas.length === 0){
      personaListEl.innerHTML = '<div class="empty-hint">No custom AIs yet. Create one to give Matrix AI its own name and instructions.</div>';
      return;
    }
    personas.forEach(p => {
      const row = document.createElement('div');
      row.className = 'persona-row' + (p.id === activePersonaId ? ' active' : '');
      row.innerHTML = `
        <div class="avatar ai persona-avatar">${escapeHtml(p.name.slice(0,1).toUpperCase())}</div>
        <div class="row-text">
          <div class="row-title">${escapeHtml(p.name)}</div>
          <div class="row-sub">${escapeHtml(singleLine(p.instructions))}</div>
        </div>
        <div class="row-actions">
          <button class="row-action-btn edit-btn" title="Edit"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
          <button class="row-action-btn delete-btn" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>`;
      row.addEventListener('click', (e) => {
        if(e.target.closest('.row-actions')) return;
        selectPersona(p.id);
      });
      row.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); openPersonaModal(p); });
      row.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deletePersona(p.id); });
      personaListEl.appendChild(row);
    });
  }

  function renderConversationList(){
    conversationListEl.innerHTML = '';
    if(conversations.length === 0){
      conversationListEl.innerHTML = '<div class="empty-hint">Your conversations will show up here once you start chatting.</div>';
      return;
    }
    conversations.forEach(c => {
      const row = document.createElement('div');
      row.className = 'conversation-row' + (c.id === activeConversationId ? ' active' : '');
      const initial = c.personaName ? c.personaName.slice(0, 1).toUpperCase() : null;
      const avatarHtml = initial
        ? `<div class="avatar ai persona-avatar">${escapeHtml(initial)}</div>`
        : `<div class="row-dot"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>`;
      row.innerHTML = `
        ${avatarHtml}
        <div class="row-text">
          <div class="row-title">${escapeHtml(c.title || 'New chat')}</div>
          <div class="row-sub">${escapeHtml(c.personaName || 'Matrix AI')} · ${relTime(c.updatedAt)}</div>
        </div>
        <div class="row-actions">
          <button class="row-action-btn delete-btn" title="Delete"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
        </div>`;
      row.addEventListener('click', (e) => {
        if(e.target.closest('.row-actions')) return;
        loadConversation(c.id);
      });
      row.querySelector('.delete-btn').addEventListener('click', (e) => { e.stopPropagation(); deleteConversation(c.id); });
      conversationListEl.appendChild(row);
    });
  }

  function clearChatView(){
    chatInner.querySelectorAll('.msg-row').forEach(el => el.remove());
  }

  function startNewChat(){
    activePersonaId = null;
    activeConversationId = null;
    history = [];
    clearChatView();
    updateEmptyStateForActive();
    emptyState.style.display = 'flex';
    renderPersonaList();
    renderConversationList();
    updateHeader();
    closeSidebar();
  }

  function selectPersona(id){
    activePersonaId = id;
    activeConversationId = null;
    history = [];
    clearChatView();
    updateEmptyStateForActive();
    emptyState.style.display = 'flex';
    renderPersonaList();
    renderConversationList();
    updateHeader();
    closeSidebar();
    input.focus();
  }

  function displayTextFor(m){
    if(m.displayText !== undefined) return m.displayText;
    return typeof m.content === 'string' ? m.content : '';
  }

  function loadConversation(id){
    const conv = conversations.find(c => c.id === id);
    if(!conv) return;
    activeConversationId = id;
    activePersonaId = conv.personaId || null;
    history = conv.messages.map(m => ({ role: m.role, content: m.content, displayText: m.displayText, attachments: m.attachments }));
    clearChatView();
    if(history.length){
      emptyState.style.display = 'none';
      history.forEach(m => addMessage(m.role, displayTextFor(m), m.attachments));
    } else {
      updateEmptyStateForActive();
      emptyState.style.display = 'flex';
    }
    renderPersonaList();
    renderConversationList();
    updateHeader();
    closeSidebar();
  }

  function deleteConversation(id){
    if(!confirm('Delete this conversation? This can\'t be undone.')) return;
    conversations = conversations.filter(c => c.id !== id);
    saveConversations();
    if(activeConversationId === id){
      startNewChat();
    } else {
      renderConversationList();
    }
  }

  function deletePersona(id){
    if(!confirm('Delete this custom AI? Past chats with it will stay in your history.')) return;
    personas = personas.filter(p => p.id !== id);
    savePersonas();
    if(activePersonaId === id){
      startNewChat();
    } else {
      renderPersonaList();
    }
  }

  function persistCurrentConversation(){
    if(history.length === 0) return;
    const persona = getActivePersona();
    const packMessages = () => history.map(m => ({
      role: m.role, content: m.content, displayText: m.displayText, attachments: m.attachments
    }));
    if(!activeConversationId){
      activeConversationId = uid();
      const firstUser = history.find(m => m.role === 'user');
      let raw = firstUser ? singleLine(displayTextFor(firstUser)) : '';
      if(!raw && firstUser && firstUser.attachments && firstUser.attachments.length){
        raw = firstUser.attachments.map(a => a.name).join(', ');
      }
      const title = raw ? (raw.length > 42 ? raw.slice(0, 42) + '…' : raw) : 'New chat';
      conversations.unshift({
        id: activeConversationId,
        title,
        personaId: persona ? persona.id : null,
        personaName: persona ? persona.name : null,
        messages: packMessages(),
        createdAt: Date.now(),
        updatedAt: Date.now()
      });
    } else {
      const conv = conversations.find(c => c.id === activeConversationId);
      if(conv){
        conv.messages = packMessages();
        conv.updatedAt = Date.now();
        conversations = [conv, ...conversations.filter(c => c.id !== conv.id)];
      }
    }
    saveConversations();
    renderConversationList();
  }

  // ---------- persona create/edit modal ----------
  let editingPersonaId = null;

  function openPersonaModal(persona){
    editingPersonaId = persona ? persona.id : null;
    personaModalTitle.textContent = persona ? 'Edit AI' : 'Create your AI';
    personaNameInput.value = persona ? persona.name : '';
    personaInstructionsInput.value = persona ? persona.instructions : '';
    validateModal();
    personaModalBackdrop.classList.add('open');
    setTimeout(() => personaNameInput.focus(), 50);
  }
  function closePersonaModal(){
    personaModalBackdrop.classList.remove('open');
  }
  function validateModal(){
    personaModalSave.disabled = personaNameInput.value.trim().length === 0 || personaInstructionsInput.value.trim().length === 0;
  }
  personaNameInput.addEventListener('input', validateModal);
  personaInstructionsInput.addEventListener('input', validateModal);

  personaModalSave.addEventListener('click', () => {
    const name = personaNameInput.value.trim();
    const instructions = personaInstructionsInput.value.trim();
    if(!name || !instructions) return;

    if(editingPersonaId){
      const p = personas.find(p => p.id === editingPersonaId);
      if(p){ p.name = name; p.instructions = instructions; }
    } else {
      personas.unshift({ id: uid(), name, instructions, createdAt: Date.now() });
    }
    savePersonas();
    renderPersonaList();
    if(editingPersonaId && activePersonaId === editingPersonaId){
      updateHeader();
      if(history.length === 0) updateEmptyStateForActive();
    }
    closePersonaModal();
  });

  personaModalClose.addEventListener('click', closePersonaModal);
  personaModalCancel.addEventListener('click', closePersonaModal);
  personaModalBackdrop.addEventListener('click', (e) => { if(e.target === personaModalBackdrop) closePersonaModal(); });
  createPersonaBtn.addEventListener('click', () => openPersonaModal(null));
  newChatBtn.addEventListener('click', startNewChat);
  matrixCodeBtn.addEventListener('click', () => selectPersona(MATRIX_CODE_ID));
  fathomBtn.addEventListener('click', () => selectPersona(FATHOM_ID));

  document.addEventListener('keydown', (e) => {
    if(e.key !== 'Escape') return;
    if(personaModalBackdrop.classList.contains('open')) closePersonaModal();
    else if(previewPanel.classList.contains('open')) closeCodePreview();
    else if(sidebar.classList.contains('open')) closeSidebar();
  });

  function autoGrow(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', () => {
    autoGrow();
    updateSendState();
  });
  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      if(!sendBtn.disabled) sendMessage();
    }
  });

  // ---------- attachments ----------
  const attachBtn = document.getElementById('attachBtn');
  const fileInput = document.getElementById('fileInput');
  const attachmentPreviewEl = document.getElementById('attachmentPreview');

  const MAX_IMAGE_BYTES = 5 * 1024 * 1024; // 5MB
  const MAX_TEXT_CHARS = 8000;
  const TEXT_EXTENSIONS = ['.txt','.md','.markdown','.json','.csv','.js','.jsx','.ts','.tsx','.py','.html','.htm','.css','.xml','.yaml','.yml','.log','.sh','.c','.cpp','.java','.rb','.go','.rs','.sql'];

  let pendingAttachments = [];
  let toastTimer = null;

  function showToast(msg){
    let toast = document.getElementById('toast');
    if(!toast){
      toast = document.createElement('div');
      toast.id = 'toast';
      toast.className = 'toast';
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  function isImageFile(file){ return !!file.type && file.type.startsWith('image/'); }
  function isTextFile(file){
    if(file.type && file.type.startsWith('text/')) return true;
    const lower = file.name.toLowerCase();
    return TEXT_EXTENSIONS.some(ext => lower.endsWith(ext));
  }
  function formatBytes(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }
  function readAsDataURL(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function readAsText(file){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsText(file);
    });
  }

  function updateSendState(){
    sendBtn.disabled = input.value.trim().length === 0 && pendingAttachments.length === 0;
  }

  function renderAttachmentPreview(){
    attachmentPreviewEl.innerHTML = '';
    if(pendingAttachments.length === 0){
      attachmentPreviewEl.style.display = 'none';
      return;
    }
    attachmentPreviewEl.style.display = 'flex';
    pendingAttachments.forEach(att => {
      const chip = document.createElement('div');
      chip.className = 'attachment-chip';
      const media = att.kind === 'image'
        ? `<img src="${att.dataUrl}" class="attachment-thumb" alt="">`
        : `<div class="attachment-file-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></div>`;
      chip.innerHTML = `
        ${media}
        <div class="attachment-info">
          <div class="attachment-name">${escapeHtml(att.name)}</div>
          <div class="attachment-size">${formatBytes(att.size)}${att.truncated ? ' · truncated' : ''}</div>
        </div>
        <button class="attachment-remove" title="Remove">&times;</button>`;
      chip.querySelector('.attachment-remove').addEventListener('click', () => {
        pendingAttachments = pendingAttachments.filter(a => a.id !== att.id);
        renderAttachmentPreview();
        updateSendState();
      });
      attachmentPreviewEl.appendChild(chip);
    });
  }

  attachBtn.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files || []);
    fileInput.value = '';
    for(const file of files){
      if(isImageFile(file)){
        if(file.size > MAX_IMAGE_BYTES){
          showToast(`${file.name} is too large — images are limited to 5MB.`);
          continue;
        }
        try{
          const dataUrl = await readAsDataURL(file);
          pendingAttachments.push({ id: uid(), name: file.name, size: file.size, kind: 'image', dataUrl });
        } catch(err){
          showToast(`Couldn't read ${file.name}.`);
        }
      } else if(isTextFile(file)){
        try{
          let text = await readAsText(file);
          let truncated = false;
          if(text.length > MAX_TEXT_CHARS){
            text = text.slice(0, MAX_TEXT_CHARS);
            truncated = true;
          }
          pendingAttachments.push({ id: uid(), name: file.name, size: file.size, kind: 'text', textContent: text, truncated });
        } catch(err){
          showToast(`Couldn't read ${file.name}.`);
        }
      } else {
        showToast(`${file.name}: only images and text/code files can be attached right now.`);
      }
    }
    renderAttachmentPreview();
    updateSendState();
  });

  clearBtn.addEventListener('click', startNewChat);

  function escapeHtml(str){
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // very small markdown-ish renderer: code blocks, inline code, bold
  function renderContent(text){
    let html = escapeHtml(text);
    html = html.replace(/```([a-zA-Z0-9]*)\n([\s\S]*?)```/g, (m, lang, code) => {
      return `<pre><code>${code}</code></pre>`;
    });
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return html;
  }

  function timeNow(){
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function renderAttachmentsInBubble(attachments){
    const items = attachments.map(att => {
      if(att.kind === 'image' && att.dataUrl){
        return `<img src="${att.dataUrl}" class="bubble-attachment-img" alt="${escapeHtml(att.name)}">`;
      }
      return `<span class="bubble-attachment-file"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>${escapeHtml(att.name)}</span>`;
    }).join('');
    return `<div class="bubble-attachments">${items}</div>`;
  }

  function addMessage(role, text, attachments){
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'ai');

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
    avatar.textContent = role === 'user' ? 'You' : 'M';

    const col = document.createElement('div');
    col.className = 'bubble-col';

    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';

    const sender = document.createElement('div');
    sender.className = 'sender';
    sender.textContent = role === 'user' ? 'You' : (getActivePersona() ? getActivePersona().name : 'Matrix AI');
    metaRow.appendChild(sender);

    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = timeNow();
    metaRow.appendChild(ts);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    let html = '';
    if(attachments && attachments.length){
      html += renderAttachmentsInBubble(attachments);
    }
    if(text){
      html += renderContent(text);
    }
    bubble.innerHTML = html;

    col.appendChild(metaRow);
    col.appendChild(bubble);

    if(role !== 'user'){
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.title = 'Copy';
      copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(bubble.textContent).then(() => {
          copyBtn.classList.add('copied');
          setTimeout(() => copyBtn.classList.remove('copied'), 1200);
        });
      });
      metaRow.appendChild(copyBtn);
      maybeAddPreviewButton(metaRow, text);
    }

    row.appendChild(avatar);
    row.appendChild(col);
    chatInner.appendChild(row);
    main.scrollTop = main.scrollHeight;
    return bubble;
  }

  function addTyping(){
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typingRow';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'M';

    const col = document.createElement('div');
    col.className = 'bubble-col';

    const bubble = document.createElement('div');
    bubble.className = 'bubble typing';
    bubble.innerHTML = '<span></span><span></span><span></span>';

    col.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(col);
    chatInner.appendChild(row);
    main.scrollTop = main.scrollHeight;
  }

  function removeTyping(){
    const row = document.getElementById('typingRow');
    if(row) row.remove();
  }

  // ---------- code preview panel ----------
  const previewBackdrop = document.getElementById('previewBackdrop');
  const previewPanel = document.getElementById('previewPanel');
  const previewFrame = document.getElementById('previewFrame');
  const previewCloseBtn = document.getElementById('previewCloseBtn');
  const previewOpenTabBtn = document.getElementById('previewOpenTabBtn');
  let currentPreviewDoc = null;

  function openCodePreview(doc){
    currentPreviewDoc = doc;
    previewFrame.srcdoc = doc;
    previewPanel.classList.add('open');
    previewBackdrop.classList.add('open');
  }
  function closeCodePreview(){
    previewPanel.classList.remove('open');
    previewBackdrop.classList.remove('open');
  }
  previewCloseBtn.addEventListener('click', closeCodePreview);
  previewBackdrop.addEventListener('click', closeCodePreview);
  previewOpenTabBtn.addEventListener('click', () => {
    if(!currentPreviewDoc) return;
    const blob = new Blob([currentPreviewDoc], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
  });

  // Pulls fenced code blocks out of a message and, if there's an HTML (or
  // SVG) block among them, assembles a self-contained document — folding
  // in any accompanying CSS/JS blocks — that can be dropped into an iframe.
  function parseCodeBlocks(text){
    const blocks = [];
    const re = /```([a-zA-Z0-9]*)\n([\s\S]*?)```/g;
    let m;
    while((m = re.exec(text))){
      blocks.push({ lang: (m[1] || '').toLowerCase(), code: m[2] });
    }
    return blocks;
  }

  function buildPreviewDoc(text){
    const blocks = parseCodeBlocks(text);
    if(blocks.length === 0) return null;

    const htmlBlock = blocks.find(b => b.lang === 'html' || b.lang === 'htm' || /<!doctype html|<html[\s>]/i.test(b.code));
    const svgBlock = !htmlBlock ? blocks.find(b => b.lang === 'svg' || /^\s*<svg[\s>]/i.test(b.code)) : null;
    if(!htmlBlock && !svgBlock) return null;

    if(svgBlock){
      return `<!DOCTYPE html><html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:#fff;}</style></head><body>${svgBlock.code}</body></html>`;
    }

    const cssBlocks = blocks.filter(b => b.lang === 'css');
    const jsBlocks = blocks.filter(b => b.lang === 'js' || b.lang === 'javascript');
    let doc = htmlBlock.code;

    const extraStyle = cssBlocks.map(b => b.code).join('\n');
    if(extraStyle){
      doc = /<\/head>/i.test(doc)
        ? doc.replace(/<\/head>/i, `<style>\n${extraStyle}\n</style>\n</head>`)
        : `<style>\n${extraStyle}\n</style>\n` + doc;
    }

    const extraScript = jsBlocks.map(b => b.code).join('\n');
    if(extraScript){
      doc = /<\/body>/i.test(doc)
        ? doc.replace(/<\/body>/i, `<script>\n${extraScript}\n<\/script>\n</body>`)
        : doc + `\n<script>\n${extraScript}\n<\/script>`;
    }

    if(!/<html[\s>]/i.test(doc)){
      doc = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${doc}</body></html>`;
    }
    return doc;
  }

  function maybeAddPreviewButton(metaRow, text){
    const doc = buildPreviewDoc(text);
    if(!doc) return;
    const btn = document.createElement('button');
    btn.className = 'copy-btn preview-btn';
    btn.title = 'Preview';
    btn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>';
    btn.addEventListener('click', () => openCodePreview(doc));
    metaRow.appendChild(btn);
  }

  function matchesIdentity(text){
    return IDENTITY_PATTERNS.some(re => re.test(text));
  }

  function startStreamingMessage(){
    emptyState.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'msg-row ai';

    const avatar = document.createElement('div');
    avatar.className = 'avatar ai';
    avatar.textContent = 'M';

    const col = document.createElement('div');
    col.className = 'bubble-col';

    const metaRow = document.createElement('div');
    metaRow.className = 'meta-row';
    const sender = document.createElement('div');
    sender.className = 'sender';
    sender.textContent = getActivePersona() ? getActivePersona().name : 'Matrix AI';
    const ts = document.createElement('div');
    ts.className = 'timestamp';
    ts.textContent = timeNow();
    metaRow.appendChild(sender);
    metaRow.appendChild(ts);

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="cursor"></span>';

    col.appendChild(metaRow);
    col.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(col);
    chatInner.appendChild(row);
    main.scrollTop = main.scrollHeight;

    let raw = '';
    return {
      update(chunk){
        raw += chunk;
        bubble.innerHTML = renderContent(raw) + '<span class="cursor"></span>';
        main.scrollTop = main.scrollHeight;
      },
      finalize(){
        bubble.innerHTML = renderContent(raw);
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.title = 'Copy';
        copyBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
        copyBtn.addEventListener('click', () => {
          navigator.clipboard.writeText(raw).then(() => {
            copyBtn.classList.add('copied');
            setTimeout(() => copyBtn.classList.remove('copied'), 1200);
          });
        });
        metaRow.appendChild(copyBtn);
        maybeAddPreviewButton(metaRow, raw);
        return raw;
      },
      row
    };
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text && pendingAttachments.length === 0) return;

    const attachmentsSnapshot = pendingAttachments;
    pendingAttachments = [];
    renderAttachmentPreview();

    input.value = '';
    autoGrow();
    updateSendState();

    const imageAtts = attachmentsSnapshot.filter(a => a.kind === 'image');
    const textAtts = attachmentsSnapshot.filter(a => a.kind === 'text');

    // Text-file contents get inlined into the prompt so any model can read
    // them; images become separate content parts (used only if the active
    // model supports vision).
    let combinedText = text;
    textAtts.forEach(att => {
      combinedText += `\n\n--- Attached file: ${att.name}${att.truncated ? ' (truncated)' : ''} ---\n\`\`\`\n${att.textContent}\n\`\`\``;
    });
    if(!combinedText.trim() && attachmentsSnapshot.length){
      combinedText = 'Please review the attached file(s).';
    }

    let apiContent = combinedText;
    if(imageAtts.length){
      apiContent = [{ type: 'text', text: combinedText }];
      imageAtts.forEach(att => apiContent.push({ type: 'image_url', image_url: { url: att.dataUrl } }));
    }

    const attachmentsMeta = attachmentsSnapshot.map(a => ({
      name: a.name, kind: a.kind, size: a.size,
      dataUrl: a.kind === 'image' ? a.dataUrl : undefined
    }));

    addMessage('user', text, attachmentsMeta);
    history.push({ role: 'user', content: apiContent, displayText: text, attachments: attachmentsMeta });
    persistCurrentConversation();

    if(matchesIdentity(text)){
      addTyping();
      await new Promise(r => setTimeout(r, 450));
      removeTyping();
      const reply = identityReplyFor(getActivePersona());
      addMessage('assistant', reply);
      history.push({ role: 'assistant', content: reply });
      persistCurrentConversation();
      return;
    }

    addTyping();

    const activePersona = getActivePersona();
    const providerName = (activePersona && activePersona.provider) || 'openrouter';

    let streamer = null;
    let fullReply = '';

    try{
      const res = await fetch(CHAT_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          provider: providerName,
          systemPrompt: buildSystemPrompt(activePersona),
          messages: history.map(m => ({ role: m.role, content: m.content }))
        })
      });

      if(!res.ok || !res.body){
        const errJson = await res.json().catch(() => null);
        throw new Error(errJson && errJson.error ? errJson.error : ('HTTP ' + res.status));
      }

      removeTyping();
      streamer = startStreamingMessage();

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop(); // keep incomplete line for next chunk

        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed.startsWith('data:')) continue;
          const payload = trimmed.slice(5).trim();
          if(payload === '[DONE]') continue;
          try{
            const json = JSON.parse(payload);
            const delta = json.choices && json.choices[0] && json.choices[0].delta
              ? json.choices[0].delta.content
              : null;
            if(delta){
              fullReply += delta;
              streamer.update(delta);
            }
          } catch(e){
            // ignore malformed / keep-alive lines
          }
        }
      }

      // safety net: if the model leaks a different identity, override
      if(/\b(chatgpt|gpt-|qwen|llama|gemini|i am an ai language model developed by)\b/i.test(fullReply)){
        fullReply = identityReplyFor(activePersona);
        streamer.row.querySelector('.bubble').innerHTML = renderContent(fullReply);
      }

      streamer.finalize();
      history.push({ role: 'assistant', content: fullReply || '(no response)' });
      persistCurrentConversation();

    } catch(err){
      removeTyping();
      if(streamer){
        streamer.row.remove();
      }
      const isNetworkError = err instanceof TypeError; // fetch throws TypeError if the backend isn't running
      const detail = isNetworkError
        ? `Couldn't reach the backend at ${CHAT_ENDPOINT}. Make sure "npm start" is running.`
        : err.message;
      addMessage('assistant', `Couldn't reach ${activePersona ? activePersona.name : 'Matrix AI'}.\n\n\`${detail}\``);
      console.error(err);
    }
  }

  sendBtn.addEventListener('click', sendMessage);

  // ---------- boot ----------
  renderPersonaList();
  renderConversationList();
  updateHeader();
  updateEmptyStateForActive();

</script>
